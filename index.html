<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精準倒計時器 (自動跳轉優化版)</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            margin: 0;
        }
        .settings-bar {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        #timer-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .timer-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            width: 280px;
            min-height: 220px;
            text-align: center;
            transition: transform 0.3s ease, background-color 0.3s;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .timer-running {
            background-color: #ffecec !important;
            border-color: #ffcfcf !important;
        }
        .timer-running .input-group,
        .timer-running .btn-start {
            display: none;
        }
        .timer-card:not(.timer-running) .display,
        .timer-card:not(.timer-running) .btn-stop {
            display: none;
        }
        h3 { margin: 0 0 10px 0; font-size: 1.4em; color: #333; }
        .input-group { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px; }
        input[type="number"] { width: 70px; font-size: 28px; text-align: center; border: 2px solid #ddd; border-radius: 8px; padding: 5px; }
        .display { font-size: 60px; font-weight: bold; font-family: 'Courier New', Courier, monospace; margin: 5px 0; color: #d63031; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-stop { background-color: #636e72; color: white; }
        .btn-test { background-color: #3498db; color: white; font-size: 14px; padding: 5px 12px; margin-top: 0; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

<div class="settings-bar">
    <span>音效提醒 (剩 1 分鐘時):</span>
    <label class="switch">
        <input type="checkbox" id="sound-toggle" onchange="toggleSoundSetting()">
        <span class="slider"></span>
    </label>
    <span id="sound-status">關閉</span>
    <button class="btn btn-test" onclick="playTestSound()">🔊 音效測試 (1.mp3)</button>
</div>

<div id="timer-container"></div>

<audio id="alert-sound" src="1.mp3"></audio>

<script>
    const timerNames = ["勞動檢處", "昇陽", "溪頭公園", "聖天宮", "鎮天宮", "welcome", "浪極光", "拱門天橋"];
    let timers = {}; 
    const container = document.getElementById('timer-container');

    let soundEnabled = localStorage.getItem('timer_sound_enabled') === 'true';
    document.getElementById('sound-toggle').checked = soundEnabled;
    document.getElementById('sound-status').innerText = soundEnabled ? "開啟" : "關閉";

    function toggleSoundSetting() {
        soundEnabled = document.getElementById('sound-toggle').checked;
        localStorage.setItem('timer_sound_enabled', soundEnabled);
        document.getElementById('sound-status').innerText = soundEnabled ? "開啟" : "關閉";
    }

    function playTestSound() {
        const audio = document.getElementById('alert-sound');
        audio.currentTime = 0;
        audio.play().catch(() => alert("播放失敗！請確認資料夾內是否有 1.mp3"));
    }

    // 初始化區塊
    timerNames.forEach((name, i) => {
        const savedInput = JSON.parse(localStorage.getItem(`timer_input_${i}`)) || { min: "00", sec: "00" };
        const savedEndTime = localStorage.getItem(`timer_endtime_${i}`);
        const card = document.createElement('div');
        card.className = 'timer-card';
        card.id = `card-${i}`;
        
        const now = Date.now();
        let isRunning = false;
        let endTime = null;
        if (savedEndTime && parseInt(savedEndTime) > now) {
            isRunning = true;
            endTime = parseInt(savedEndTime);
            card.classList.add('timer-running');
        }

        card.innerHTML = `
            <h3>${name}</h3>
            <div class="input-group">
                <input type="number" id="min-${i}" value="${savedInput.min}" oninput="limitAndSave(${i}, 'min', 2)">
                <span>:</span>
                <input type="number" id="sec-${i}" value="${savedInput.sec}" oninput="limitAndSave(${i}, 'sec', 2)">
            </div>
            <div class="display" id="disp-${i}">00:00</div>
            <button class="btn btn-start" onclick="event.stopPropagation(); startTimer(${i});">開始 (+5分)</button>
            <button class="btn btn-stop" onclick="event.stopPropagation(); stopTimer(${i});">停止</button>
        `;
        
        card.onclick = function() {
            if (!timers[i].isRunning) {
                const minInp = document.getElementById(`min-${i}`);
                minInp.focus(); minInp.select();
            }
        };

        container.appendChild(card);
        timers[i] = { 
            name: name, 
            endTime: endTime, 
            isRunning: isRunning, 
            remaining: isRunning ? Math.ceil((endTime - now) / 1000) : 0, 
            alerted: false 
        };
        if(isRunning) updateDisplayValue(i);
    });

    function updateDisplayValue(i) {
        const diff = timers[i].endTime - Date.now();
        const rem = Math.max(0, Math.ceil(diff / 1000));
        let m = Math.floor(rem / 60);
        let s = rem % 60;
        document.getElementById(`disp-${i}`).innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function limitAndSave(index, type, maxLen) {
        const input = document.getElementById(`${type}-${index}`);
        
        // 限制字數
        if (input.value.length > maxLen) {
            input.value = input.value.slice(0, maxLen);
        }

        // 自動跳轉邏輯：如果在「分」輸入滿 2 碼，自動跳到「秒」
        if (type === 'min' && input.value.length === 2) {
            const secInput = document.getElementById(`sec-${index}`);
            secInput.focus();
            secInput.select();
        }

        const minVal = document.getElementById(`min-${index}`).value;
        const secVal = document.getElementById(`sec-${index}`).value;
        localStorage.setItem(`timer_input_${index}`, JSON.stringify({ min: minVal, sec: secVal }));
    }

    function startTimer(i) {
        const m = parseInt(document.getElementById(`min-${i}`).value) || 0;
        const s = parseInt(document.getElementById(`sec-${i}`).value) || 0;
        // 開始時自動加 5 分鐘
        const endTime = Date.now() + ((m + 5) * 60 + s) * 1000;
        
        timers[i].endTime = endTime;
        timers[i].isRunning = true;
        timers[i].alerted = false; 
        
        localStorage.setItem(`timer_endtime_${i}`, endTime);
        document.getElementById(`card-${i}`).classList.add('timer-running');
        sortCards();
    }

    function stopTimer(i) {
        timers[i].isRunning = false;
        timers[i].endTime = null;
        timers[i].alerted = false;
        localStorage.removeItem(`timer_endtime_${i}`);
        document.getElementById(`card-${i}`).classList.remove('timer-running');
        sortCards();
    }

    function sortCards() {
        const cards = Array.from(container.children);
        cards.sort((a, b) => {
            const idA = a.id.split('-')[1], idB = b.id.split('-')[1];
            const tA = timers[idA].isRunning ? timers[idA].remaining : Infinity;
            const tB = timers[idB].isRunning ? timers[idB].remaining : Infinity;
            return tA - tB;
        });
        cards.forEach((card, index) => card.style.order = index);
    }

    window.onload = function() {
        timerNames.forEach((_, i) => {
            const minInp = document.getElementById(`min-${i}`);
            const secInp = document.getElementById(`sec-${i}`);
            // 綁定 Enter 鍵直接開始
            const handleEnter = (e) => { if (e.key === 'Enter') startTimer(i); };
            minInp.addEventListener('keypress', handleEnter);
            secInp.addEventListener('keypress', handleEnter);
        });
        sortCards();
    };

    setInterval(() => {
        const now = Date.now();
        let shortest = null;
        let needsSort = false;

        for (let i in timers) {
            if (timers[i].isRunning) {
                const diff = timers[i].endTime - now;
                if (diff <= 0) {
                    stopTimer(i);
                    needsSort = true;
                } else {
                    const rem = Math.ceil(diff / 1000);
                    
                    // 剩 1 分鐘音效提醒
                    if (soundEnabled && rem === 60 && !timers[i].alerted) {
                        const audio = document.getElementById('alert-sound');
                        audio.currentTime = 0;
                        audio.play().catch(()=>{});
                        timers[i].alerted = true;
                    }

                    if (rem !== timers[i].remaining) {
                        timers[i].remaining = rem;
                        updateDisplayValue(i);
                        needsSort = true;
                    }
                    if (!shortest || rem < shortest.remaining) shortest = timers[i];
                }
            }
        }
        if (needsSort) sortCards();
        document.title = shortest ? `${Math.floor(shortest.remaining/60)}:${String(shortest.remaining%60).padStart(2,'0')} - ${shortest.name}` : "精準倒計時器";
    }, 500);
</script>
</body>
</html>
