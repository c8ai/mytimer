<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精準倒計時器 (緊湊防捲軸版)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="倒計時器">
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f2f5;
            padding: 15px;
            margin: 0;
            box-sizing: border-box;
        }
        /* 頂部設定欄 */
        .settings-bar {
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        /* 群組主容器網格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        /* 獨立群組區塊 */
        .group-box {
            background: #e4e7eb;
            border-radius: 15px;
            padding: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        
        /* 讓第五個群組（環河）在滿版時橫跨兩欄，置於最下方 */
        .group-box.bottom-full {
            grid-column: span 2;
            border-top: 5px solid #1abc9c;
        }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: 1fr; /* 手機版自動切換為單欄 */
            }
            .group-box.bottom-full {
                grid-column: span 1;
            }
        }

        /* 各群組不同的顏色邊框，增加辨識度 */
        .group-box.top-left { border-top: 5px solid #3498db; }
        .group-box.top-right { border-top: 5px solid #2ecc71; }
        .group-box.bottom-left { border-top: 5px solid #9b59b6; }
        .group-box.bottom-right { border-top: 5px solid #e67e22; }

        .group-title {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            color: #4a5568;
            font-weight: bold;
            text-align: left;
            padding-left: 5px;
        }

        /* 群組內部的卡片排列 */
        .timer-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-start;
        }

        /* 計時器卡片樣式 - 高度調降 10% 且結構緊湊化 */
        .timer-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 10px 12px;
            width: calc(50% - 6px); /* 預設一排兩卡 */
            min-width: 230px;
            min-height: 140px; /* 已調降高度，防止出現捲軸 */
            text-align: center;
            transition: transform 0.2s, background-color 0.3s;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }
        @media (max-width: 550px) {
            .timer-card {
                width: 100%; /* 極小螢幕滿版 */
            }
        }

        .timer-running {
            background-color: #ffecec !important;
            border-color: #fecaca !important;
        }
        .timer-running .input-group,
        .timer-running .btn-start {
            display: none;
        }
        .timer-card:not(.timer-running) .display,
        .timer-card:not(.timer-running) .btn-stop {
            display: none;
        }

        h3 { margin: 0 0 6px 0; font-size: 1.15em; color: #2d3748; }
        .input-group { display: flex; justify-content: center; align-items: center; gap: 5px; margin-bottom: 8px; }
        input[type="number"] { width: 60px; font-size: 22px; text-align: center; border: 2px solid #cbd5e1; border-radius: 6px; padding: 2px; }
        .display { font-size: 40px; font-weight: bold; font-family: 'Courier New', Courier, monospace; margin: 2px 0; color: #dc2626; }
        
        /* 按鈕 */
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 3px; transition: 0.1s; }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-stop { background-color: #718096; color: white; }
        .btn-test { background-color: #3498db; color: white; font-size: 14px; padding: 5px 12px; margin-top: 0; }
        .btn-notify { background-color: #9b59b6; color: white; font-size: 14px; padding: 5px 12px; margin-top: 0; }
        
        /* 開關 */
        .switch { position: relative; display: inline-block; width: 46px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>

<div class="settings-bar">
    <span>音效提醒 (剩 1 分鐘時):</span>
    <label class="switch">
        <input type="checkbox" id="sound-toggle" onchange="toggleSoundSetting()">
        <span class="slider"></span>
    </label>
    <span id="sound-status">關閉</span>
    <button class="btn btn-test" onclick="playTestSound()">🔊 測試音效/震動</button>
    <button class="btn btn-notify" onclick="requestNotificationPermission()">🔔 允許通知權限</button>
</div>

<div class="grid-container">
    <div class="group-box top-left">
        <div class="group-title">↖️ 左上群組</div>
        <div class="timer-cluster" id="cluster-tl"></div>
    </div>
    
    <div class="group-box top-right">
        <div class="group-title">↗️ 右上群組</div>
        <div class="timer-cluster" id="cluster-tr"></div>
    </div>

    <div class="group-box bottom-left">
        <div class="group-title">↙️ 左下群組</div>
        <div class="timer-cluster" id="cluster-bl"></div>
    </div>

    <div class="group-box bottom-right">
        <div class="group-title">↘️ 右下群組</div>
        <div class="timer-cluster" id="cluster-br"></div>
    </div>

    <div class="group-box bottom-full">
        <div class="group-title">🌊 環河</div>
        <div class="timer-cluster" id="cluster-bh"></div>
    </div>
</div>

<audio id="alert-sound" src="1.mp3"></audio>

<script>
    const groupConfigs = {
        tl: { elId: "cluster-tl", names: ["浪極光", "勞動檢處", "聖天宮"] },
        tr: { elId: "cluster-tr", names: ["拱門天橋", "郵局", "鎮天宮", "welcome"] },
        bl: { elId: "cluster-bl", names: ["溪頭公園", "公園石碑", "水仙香爐"] },
        br: { elId: "cluster-br", names: ["潮和宮", "昇陽", "紀念碑文"] },
        bh: { elId: "cluster-bh", names: ["滑水道", "熱氣球"] }
    };

    let timers = {}; 
    let soundEnabled = localStorage.getItem('timer_sound_enabled') === 'true';
    
    document.getElementById('sound-toggle').checked = soundEnabled;
    document.getElementById('sound-status').innerText = soundEnabled ? "開啟" : "關閉";

    function toggleSoundSetting() {
        soundEnabled = document.getElementById('sound-toggle').checked;
        localStorage.setItem('timer_sound_enabled', soundEnabled);
        document.getElementById('sound-status').innerText = soundEnabled ? "開啟" : "關閉";
    }

    function playTestSound() {
        const audio = document.getElementById('alert-sound');
        audio.currentTime = 0;
        audio.play().catch(() => alert("音效播放失敗"));
        if ("vibrate" in navigator) navigator.vibrate(500);
    }

    function requestNotificationPermission() {
        if (!("Notification" in window)) { alert("此瀏覽器不支援通知功能"); return; }
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                alert("通知權限已開啟！");
                new Notification("計時器通知", { body: "通知與背景運作已就緒。" });
            }
        });
    }

    function sendBgNotification(title, message) {
        if (Notification.permission === "granted") {
            new Notification(title, { body: message });
        }
        if ("vibrate" in navigator) navigator.vibrate(1000);
    }

    // 初始化建立卡片
    let globalIdCounter = 0;
    
    for (let groupKey in groupConfigs) {
        const config = groupConfigs[groupKey];
        const targetContainer = document.getElementById(config.elId);
        
        config.names.forEach((name) => {
            const currentId = globalIdCounter++;
            
            const storageKeyInput = `g_input_${groupKey}_${name}`;
            const storageKeyEndTime = `g_endtime_${groupKey}_${name}`;

            const savedInput = JSON.parse(localStorage.getItem(storageKeyInput)) || { min: "00", sec: "00" };
            const savedEndTime = localStorage.getItem(storageKeyEndTime);
            
            const card = document.createElement('div');
            card.className = 'timer-card';
            card.id = `card-${currentId}`;
            
            const now = Date.now();
            let isRunning = false;
            let endTime = null;
            if (savedEndTime && parseInt(savedEndTime) > now) {
                isRunning = true;
                endTime = parseInt(savedEndTime);
                card.classList.add('timer-running');
            }

            card.innerHTML = `
                <h3>${name}</h3>
                <div class="input-group">
                    <input type="number" id="min-${currentId}" value="${savedInput.min}" oninput="limitAndSave(${currentId}, 'min', '${storageKeyInput}')">
                    <span>:</span>
                    <input type="number" id="sec-${currentId}" value="${savedInput.sec}" oninput="limitAndSave(${currentId}, 'sec', '${storageKeyInput}')">
                </div>
                <div class="display" id="disp-${currentId}">00:00</div>
                <button class="btn btn-start" onclick="event.stopPropagation(); startTimer(${currentId}, '${storageKeyEndTime}');">開始 (+5分)</button>
                <button class="btn btn-stop" onclick="event.stopPropagation(); stopTimer(${currentId}, '${storageKeyEndTime}');">停止</button>
            `;
            
            card.onclick = function() {
                if (!timers[currentId].isRunning) {
                    const minInp = document.getElementById(`min-${currentId}`);
                    minInp.focus(); minInp.select();
                }
            };

            targetContainer.appendChild(card);

            timers[currentId] = { 
                id: currentId,
                name: name, 
                groupKey: groupKey,
                endTime: endTime, 
                isRunning: isRunning, 
                remaining: isRunning ? Math.ceil((endTime - now) / 1000) : 0, 
                alerted: false 
            };
            
            if(isRunning) updateDisplayValue(currentId);
        });
    }

    function updateDisplayValue(id) {
        const diff = timers[id].endTime - Date.now();
        const rem = Math.max(0, Math.ceil(diff / 1000));
        let m = Math.floor(rem / 60);
        let s = rem % 60;
        document.getElementById(`disp-${id}`).innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function limitAndSave(id, type, storageKey) {
        const input = document.getElementById(`${type}-${id}`);
        if (input.value.length > 2) input.value = input.value.slice(0, 2);
        
        if (type === 'min' && input.value.length === 2) {
            const secInput = document.getElementById(`sec-${id}`);
            secInput.focus(); secInput.select();
        }
        const minVal = document.getElementById(`min-${id}`).value;
        const secVal = document.getElementById(`sec-${id}`).value;
        localStorage.setItem(storageKey, JSON.stringify({ min: minVal, sec: secVal }));
    }

    function startTimer(id, storageKeyEndTime) {
        const m = parseInt(document.getElementById(`min-${id}`).value) || 0;
        const s = parseInt(document.getElementById(`sec-${id}`).value) || 0;
        const endTime = Date.now() + ((m + 5) * 60 + s) * 1000;
        
        timers[id].endTime = endTime;
        timers[id].isRunning = true;
        timers[id].alerted = false; 
        
        localStorage.setItem(storageKeyEndTime, endTime);
        document.getElementById(`card-${id}`).classList.add('timer-running');
        sortCluster(timers[id].groupKey);
    }

    function stopTimer(id, storageKeyEndTime) {
        timers[id].isRunning = false;
        timers[id].endTime = null;
        timers[id].alerted = false;
        localStorage.removeItem(storageKeyEndTime);
        document.getElementById(`card-${id}`).classList.remove('timer-running');
        sortCluster(timers[id].groupKey);
    }

    function sortCluster(groupKey) {
        const config = groupConfigs[groupKey];
        const clusterContainer = document.getElementById(config.elId);
        const cards = Array.from(clusterContainer.children);
        
        cards.sort((a, b) => {
            const idA = parseInt(a.id.split('-')[1]);
            const idB = parseInt(b.id.split('-')[1]);
            const tA = timers[idA].isRunning ? timers[idA].remaining : Infinity;
            const tB = timers[idB].isRunning ? timers[idB].remaining : Infinity;
            return tA - tB;
        });
        cards.forEach((card, index) => card.style.order = index);
    }

    window.onload = function() {
        for (let id in timers) {
            const minInp = document.getElementById(`min-${id}`);
            const secInp = document.getElementById(`sec-${id}`);
            const handleEnter = (e) => { if (e.key === 'Enter') {
                const storageKeyEndTime = `g_endtime_${timers[id].groupKey}_${timers[id].name}`;
                startTimer(id, storageKeyEndTime);
            }};
            minInp.addEventListener('keypress', handleEnter);
            secInp.addEventListener('keypress', handleEnter);
        }
        for (let groupKey in groupConfigs) { sortCluster(groupKey); }
    };

    setInterval(() => {
        const now = Date.now();
        let shortest = null;
        let updatedGroups = new Set();

        for (let id in timers) {
            if (timers[id].isRunning) {
                const diff = timers[id].endTime - now;
                const groupKey = timers[id].groupKey;
                const storageKeyEndTime = `g_endtime_${groupKey}_${timers[id].name}`;

                if (diff <= 0) {
                    if (soundEnabled && !timers[id].alerted) {
                        sendBgNotification("⚠️ 計時結束", `【${timers[id].name}】時間已到！`);
                        timers[id].alerted = true;
                    }
                    stopTimer(id, storageKeyEndTime);
                    updatedGroups.add(groupKey);
                } else {
                    const rem = Math.ceil(diff / 1000);
                    
                    if (soundEnabled && rem === 60 && !timers[id].alerted) {
                        const audio = document.getElementById('alert-sound');
                        audio.currentTime = 0;
                        audio.play().catch(()=>{});
                        
                        sendBgNotification("⏰ 倒數提醒", `【${timers[id].name}】剩餘 1 分鐘！`);
                        timers[id].alerted = true;
                    }

                    if (rem !== timers[id].remaining) {
                        timers[id].remaining = rem;
                        updateDisplayValue(id);
                        updatedGroups.add(groupKey);
                    }
                    if (!shortest || rem < shortest.remaining) shortest = timers[id];
                }
            }
        }
        
        updatedGroups.forEach(groupKey => sortCluster(groupKey));
        document.title = shortest ? `${Math.floor(shortest.remaining/60)}:${String(shortest.remaining%60).padStart(2,'0')} - ${shortest.name}` : "精準倒計時器";
    }, 500);
</script>
</body>
</html>
